name: Cut Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (no tag push)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  cut-release:
    name: Bump version & create release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current version
        id: current
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Compute next version
        id: next
        run: |
          IFS='.' read -r major minor patch <<< "${{ steps.current.outputs.version }}"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          NEXT="${major}.${minor}.${patch}"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT"

      - name: Check tag does not exist
        run: |
          NEXT="v${{ steps.next.outputs.version }}"
          if git rev-parse "$NEXT" >/dev/null 2>&1; then
            echo "::error::Tag $NEXT already exists"
            exit 1
          fi

      - name: Create release branch
        run: |
          git checkout -b release/v${{ steps.next.outputs.version }}

      - name: Update Cargo.toml
        run: |
          sed -i "0,/^version = .*/s//version = \"${{ steps.next.outputs.version }}\"/" Cargo.toml
          echo "Updated Cargo.toml:"
          grep '^version' Cargo.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update Cargo.lock
        run: cargo check

      - name: Update CHANGELOG.md
        run: |
          set -euo pipefail

          NEXT_VERSION="${{ steps.next.outputs.version }}"
          TODAY=$(date -u +%Y-%m-%d)

          if [ ! -f CHANGELOG.md ]; then
            cat > CHANGELOG.md << 'SCAFFOLD'
          # Changelog

          All notable changes to this project will be documented in this file.

          The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
          and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
          SCAFFOLD
          fi

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          LOG_ARGS="--pretty=format:%s"
          if [ -n "$LAST_TAG" ]; then
            LOG_ARGS="${LAST_TAG}..HEAD ${LOG_ARGS}"
          fi

          COMMITS=$(git log ${LOG_ARGS} 2>/dev/null | sort -u)

          ADDED=""
          CHANGED=""
          FIXED=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if echo "$line" | grep -qE "^(release:|Merge (branch|pull request))"; then
              continue
            fi
            if echo "$line" | grep -qiE "^feat(\(|:)"; then
              entry=$(echo "$line" | sed -E 's/^feat(\([^)]*\))?:\s*//')
              ADDED="${ADDED}\n- ${entry}"
            elif echo "$line" | grep -qiE "^fix(\(|:)"; then
              entry=$(echo "$line" | sed -E 's/^fix(\([^)]*\))?:\s*//')
              FIXED="${FIXED}\n- ${entry}"
            elif echo "$line" | grep -qiE "^(refactor|perf|docs|ci|build|chore)(\(|:)"; then
              entry=$(echo "$line" | sed -E 's/^[a-z]+(\([^)]*\))?:\s*//')
              CHANGED="${CHANGED}\n- ${entry}"
            fi
          done <<< "$COMMITS"

          NEW_ENTRY="## [${NEXT_VERSION}] - ${TODAY}"

          if [ -n "$ADDED" ]; then
            NEW_ENTRY="${NEW_ENTRY}\n\n### Added\n${ADDED}"
          fi
          if [ -n "$CHANGED" ]; then
            NEW_ENTRY="${NEW_ENTRY}\n\n### Changed\n${CHANGED}"
          fi
          if [ -n "$FIXED" ]; then
            NEW_ENTRY="${NEW_ENTRY}\n\n### Fixed\n${FIXED}"
          fi

          if [ -z "$ADDED" ] && [ -z "$CHANGED" ] && [ -z "$FIXED" ]; then
            NEW_ENTRY="${NEW_ENTRY}\n\n- See [release notes](https://github.com/sinzin91/search-sessions/releases/tag/v${NEXT_VERSION}) for details"
          fi

          if [ -n "$LAST_TAG" ]; then
            LINK="[${NEXT_VERSION}]: https://github.com/sinzin91/search-sessions/compare/${LAST_TAG}...v${NEXT_VERSION}"
          else
            LINK="[${NEXT_VERSION}]: https://github.com/sinzin91/search-sessions/releases/tag/v${NEXT_VERSION}"
          fi

          FIRST_ENTRY_LINE=$(grep -n "^## \[" CHANGELOG.md | head -1 | cut -d: -f1 || echo "")

          if [ -n "$FIRST_ENTRY_LINE" ]; then
            {
              head -n $((FIRST_ENTRY_LINE - 1)) CHANGELOG.md
              echo ""
              echo -e "$NEW_ENTRY"
              echo ""
              tail -n +${FIRST_ENTRY_LINE} CHANGELOG.md
            } > CHANGELOG.tmp
          else
            {
              cat CHANGELOG.md
              echo ""
              echo -e "$NEW_ENTRY"
            } > CHANGELOG.tmp
          fi

          mv CHANGELOG.tmp CHANGELOG.md

          if ! grep -qF "[${NEXT_VERSION}]:" CHANGELOG.md; then
            echo "$LINK" >> CHANGELOG.md
          fi

          echo "Updated CHANGELOG.md:"
          head -40 CHANGELOG.md

      - name: Commit changes
        run: |
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "release: v${{ steps.next.outputs.version }}"

      - name: Dry run summary
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "🏜️ Dry run — would have:"
          echo "  - Bumped ${{ steps.current.outputs.version }} → ${{ steps.next.outputs.version }}"
          echo "  - Updated CHANGELOG.md"
          echo "  - Created PR: release/v${{ steps.next.outputs.version }} → main"
          echo ""
          echo "Cargo.toml diff:"
          git diff HEAD~1 Cargo.toml
          echo ""
          echo "CHANGELOG.md diff:"
          git diff HEAD~1 CHANGELOG.md

      - name: Push branch & create PR
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git push origin release/v${{ steps.next.outputs.version }}

          gh pr create \
            --base main \
            --head release/v${{ steps.next.outputs.version }} \
            --title "release: v${{ steps.next.outputs.version }}" \
            --body "## Release v${{ steps.next.outputs.version }}

          Automated release PR created by the cut-release workflow.

          **Changes:**
          - Bumped \`Cargo.toml\` from ${{ steps.current.outputs.version }} → ${{ steps.next.outputs.version }}
          - Updated \`Cargo.lock\`
          - Updated \`CHANGELOG.md\`

          **After merging:** The release-on-merge workflow will automatically tag and create the GitHub Release with binaries."

      - name: Summary
        if: ${{ inputs.dry_run == false }}
        run: |
          echo "📋 Created release PR for v${{ steps.next.outputs.version }}"
          echo "Merge the PR to trigger tagging and release."
