name: Tag on Release Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag-release:
    name: Create tag from merged release PR
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          VERSION="${BRANCH#release/}"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $VERSION"

      - name: Verify Cargo.toml matches
        run: |
          EXPECTED="${{ steps.version.outputs.tag }}"
          EXPECTED="${EXPECTED#v}"
          ACTUAL=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Branch says $EXPECTED but Cargo.toml says $ACTUAL"
            exit 1
          fi

      - name: Create and push tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "🏷️ Pushed tag $TAG — release workflow will now build and publish."

      - name: Clean up release branch
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/${{ github.event.pull_request.head.ref }} || true
